apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: notiflex-smb
  namespace: argocd
  annotations:
    # 0: 인프라, 1: 플랫폼, 2: 애플리케이션
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/gitaiops/notiflex-platform.git
    targetRevision: main
    path: k8s/smb
  destination:
    server: https://kubernetes.default.svc
    namespace: notiflex
  syncPolicy:
    automated:
      # Git에서 사라진 리소스를 클러스터에서도 지운다.
      prune: true
      # 클러스터를 직접 수정해도 Git 상태로 되돌린다.
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
