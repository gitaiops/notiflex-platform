name: CI

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/ci.yaml'

env:
  REGISTRY: asia-northeast3-docker.pkg.dev
  IMAGE_PATH: project-9d5c279f-44bf-42c9-af2/notiflex/api

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # WIF로 GCP에 인증하려면 OIDC 토큰 발급 권한이 필요하다.
      id-token: write
      # 매니페스트의 이미지 태그를 고쳐 되돌려 push하려면 쓰기 권한이 필요하다.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: GCP 인증 (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/299472546927/locations/global/workloadIdentityPools/github/providers/gitaiops
          service_account: notiflex-ci@project-9d5c279f-44bf-42c9-af2.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Docker 인증 설정
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: 이미지 빌드 및 푸시
        run: |
          IMAGE="${REGISTRY}/${IMAGE_PATH}:sha-${GITHUB_SHA::7}"
          echo "빌드 대상: $IMAGE"
          docker build -t "$IMAGE" app/
          docker push "$IMAGE"
          # 다음 step에서 쓰려면 GITHUB_OUTPUT이 아니라 GITHUB_ENV로 넘겨야 한다.
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: 매니페스트 이미지 태그 갱신 후 push
        run: |
          # 빈 값이면 매니페스트의 이미지가 지워지므로 먼저 확인한다.
          if [ -z "$IMAGE" ]; then
            echo "IMAGE 변수가 비어 있다. 중단한다."
            exit 1
          fi
          echo "적용할 이미지: $IMAGE"
          sed -i "s|image: .*/notiflex/api:.*|image: ${IMAGE}|" k8s/smb/rollout.yaml
          if git diff --quiet k8s/smb/rollout.yaml; then
            echo "매니페스트에 변경이 없다."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/smb/rollout.yaml
          git commit -m "ci: 이미지 태그를 sha-${GITHUB_SHA::7}로 갱신"
          git push origin HEAD:main
