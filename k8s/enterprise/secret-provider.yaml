apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: notiflex-secrets
  namespace: enterprise
spec:
  # GKE managed CSI는 provider가 gke다. 오픈소스 설치본은 gcp를 쓴다.
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/project-9d5c279f-44bf-42c9-af2/secrets/valkey-password/versions/latest"
        path: "valkey-password"
