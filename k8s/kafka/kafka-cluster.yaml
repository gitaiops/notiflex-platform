apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: kafka
  labels:
    strimzi.io/cluster: notiflex-kafka
spec:
  # 단일 노드라 컨트롤러와 브로커 역할을 함께 맡는다.
  replicas: 1
  roles:
    - controller
    - broker
  storage:
    # 학습 환경이라 영속 볼륨을 두지 않는다. Pod을 다시 만들면 데이터가 사라진다.
    type: ephemeral
  resources:
    requests:
      cpu: 300m
      memory: 1Gi
    limits:
      memory: 1536Mi
  template:
    pod:
      nodeSelector:
        cloud.google.com/gke-nodepool: worker-pool
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: notiflex-kafka
  namespace: kafka
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    # Strimzi 1.1.0이 지원하는 버전은 4.2.0, 4.2.1, 4.3.0이다.
    version: 4.3.0
    metadataVersion: 4.3-IV0
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      # 브로커가 하나뿐이라 복제본도 하나로 맞춘다.
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
  entityOperator:
    # KafkaUser를 쓰지 않으므로 userOperator는 두지 않는다.
    topicOperator:
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 512Mi
    template:
      pod:
        # entityOperator의 pod 템플릿은 nodeSelector를 지원하지 않는다.
        # 지정하면 값이 잘려나가 ArgoCD가 계속 OutOfSync로 본다. affinity를 쓴다.
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: cloud.google.com/gke-nodepool
                      operator: In
                      values:
                        - worker-pool
