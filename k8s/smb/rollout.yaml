apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: notiflex-api
  namespace: notiflex
  labels:
    app: notiflex-api
spec:
  replicas: 1
  strategy:
    blueGreen:
      # 실제 트래픽을 받는 서비스
      activeService: notiflex-api
      # 새 버전을 먼저 붙여 확인하는 서비스
      previewService: notiflex-api-preview
      autoPromotionEnabled: true
      # preview에서 30초 확인한 뒤 active로 전환한다.
      autoPromotionSeconds: 30
  selector:
    matchLabels:
      app: notiflex-api
  template:
    metadata:
      labels:
        app: notiflex-api
    spec:
      containers:
        - name: api
          image: asia-northeast3-docker.pkg.dev/project-9d5c279f-44bf-42c9-af2/notiflex/api:sha-2671a1d
          ports:
            - name: http
              containerPort: 8080
          env:
            # 응답에 어느 Pod이 처리했는지 표시하기 위해 주입한다.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
