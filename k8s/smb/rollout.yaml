apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: notiflex-api
  namespace: notiflex
  labels:
    app: notiflex-api
spec:
  replicas: 1
  strategy:
    blueGreen:
      # 실제 트래픽을 받는 서비스
      activeService: notiflex-api
      # 새 버전을 먼저 붙여 확인하는 서비스
      previewService: notiflex-api-preview
      autoPromotionEnabled: true
      # preview에서 30초 확인한 뒤 active로 전환한다.
      autoPromotionSeconds: 30
  selector:
    matchLabels:
      app: notiflex-api
  template:
    metadata:
      labels:
        app: notiflex-api
    spec:
      # Workload Identity로 GCP Secret Manager에 접근한다.
      serviceAccountName: notiflex-api
      volumes:
        - name: secrets
          csi:
            # GKE managed CSI 드라이버. 오픈소스는 secrets-store.csi.k8s.io다.
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: notiflex-secrets
      containers:
        - name: api
          image: asia-northeast3-docker.pkg.dev/project-9d5c279f-44bf-42c9-af2/notiflex/api:sha-34dfd4f
          ports:
            - name: http
              containerPort: 8080
          env:
            # 응답에 어느 Pod이 처리했는지 표시하기 위해 주입한다.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: VALKEY_ADDR
              value: valkey-primary.notiflex.svc.cluster.local:6379
            # 비밀번호는 K8s Secret이 아니라 Secret Manager에서 마운트한 파일로 읽는다.
            - name: VALKEY_PASSWORD_FILE
              value: /mnt/secrets/valkey-password
          volumeMounts:
            - name: secrets
              mountPath: /mnt/secrets
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
