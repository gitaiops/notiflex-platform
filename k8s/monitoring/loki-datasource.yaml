apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-datasource
  namespace: monitoring
  labels:
    # Grafana 사이드카가 이 라벨을 보고 데이터소스를 등록한다.
    grafana_datasource: "1"
data:
  loki-datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki.monitoring.svc.cluster.local:3100
        # Prometheus가 이미 기본이다. 여기서 true면 Grafana가 기동에 실패한다.
        isDefault: false
        jsonData:
          maxLines: 1000
